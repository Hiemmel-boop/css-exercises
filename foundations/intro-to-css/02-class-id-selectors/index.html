  <head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Class and ID Selectors</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <p class="Classe1">Number 1 - I'm a class!</p>
    <div id ="ID1"><strong>Number 2 - I'm one ID.</strong></div>
    <p class="Classe2"><strong>Number 3 - I'm a class, but cooler!</strong></p>
    <div id="ID2"><strong>Number 4 - I'm another ID.</strong></div>
    <p class="Classe3">Number 5 - I'm a class!</p>
  </body>
</html>
